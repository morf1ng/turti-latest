<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TURTI · панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#FFFFFF;
  --panel:#F7F7F8;
  --line:#E5E5E7;
  --line-soft:#F0F0F2;
  --ink:#1D1D1F;
  --soft:#6E6E76;
  --faint:#9A9AA2;
  --accent:#1D1D1F;
  --green:#0F8A4C;
  --amber:#B8730A;
  --red:#C4342A;
  --r:12px;
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}

/* ═══════════════ ВХОД ═══════════════ */
.gate{max-width:380px;margin:0 auto;padding:16vh 20px 40px}
.gate-logo{width:46px;height:46px;border-radius:13px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:21px;margin:0 auto 20px}
.gate h1{font-size:22px;font-weight:600;text-align:center;letter-spacing:-.02em;margin-bottom:6px}
.gate p{text-align:center;color:var(--soft);font-size:14px;margin-bottom:24px}
.gate input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;font:400 16px 'Inter',sans-serif;color:var(--ink);transition:border-color .15s}
.gate input:focus{outline:none;border-color:var(--ink)}
.gate .btn{width:100%;margin-top:10px}
.gate-err{text-align:center;color:var(--red);font-size:13.5px;font-weight:500;margin-top:12px;min-height:20px}

/* ═══════════════ КАРКАС ═══════════════ */
.shell{display:none;min-height:100vh}
.shell.on{display:grid;grid-template-columns:240px 1fr}

.side{border-right:1px solid var(--line);padding:20px 14px;background:var(--bg);
  position:sticky;top:0;height:100vh;overflow-y:auto}
.side-top{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.side-top i{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px;font-style:normal;flex-shrink:0}
.side-top b{font-weight:600;font-size:15px;letter-spacing:-.01em}

.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:9px 10px;
  font:500 14.5px 'Inter',sans-serif;color:var(--soft);cursor:pointer;transition:background .13s,color .13s}
.nav button:hover{background:var(--panel);color:var(--ink)}
.nav button.on{background:var(--panel);color:var(--ink);font-weight:600}
.nav svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;
  padding:1px 7px;font-size:11px;font-weight:600}
.nav .cnt.zero{display:none}

.side-foot{margin-top:24px;padding:14px 10px 0;border-top:1px solid var(--line-soft)}
.side-foot a,.side-foot button{display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--faint);font:500 13px 'Inter',sans-serif;padding:6px 0;cursor:pointer;text-decoration:none}
.side-foot a:hover,.side-foot button:hover{color:var(--ink)}

/* ═══════════════ КОНТЕНТ ═══════════════ */
.main{padding:28px 32px 80px;max-width:940px}
.head{margin-bottom:22px}
.head h1{font-size:26px;font-weight:600;letter-spacing:-.025em;margin-bottom:4px}
.head p{color:var(--soft);font-size:14.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:42px;padding:10px 18px;border:0;border-radius:10px;
  background:var(--accent);color:#fff;font:600 14.5px 'Inter',sans-serif;cursor:pointer;
  transition:opacity .15s}
.btn:hover{opacity:.86}
.btn:disabled{opacity:.4;cursor:default}
.btn.line{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--panel);opacity:1}
.btn.ok{background:var(--green)}
.btn.warn{background:none;color:var(--soft);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid var(--line)}
.btn.s{min-height:34px;padding:7px 13px;font-size:13.5px;border-radius:8px}

/* карточки статистики */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.tile b{display:block;font-size:27px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.tile span{font-size:13px;color:var(--soft)}
.tile.hi b{color:var(--amber)}
.tile.hot b{color:var(--red)}

/* карточка записи */
.rec{border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;margin-bottom:11px}
.rec.wait{border-left:3px solid var(--amber)}
.rec.live{border-left:3px solid var(--green)}
.rec.off{border-left:3px solid var(--line);opacity:.6}
.rec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rec-top strong{font-weight:600;font-size:15.5px}
.when{color:var(--faint);font-size:12.5px;white-space:nowrap}
.body{margin:10px 0;font-size:14.5px;color:#3A3A40;white-space:pre-wrap}
.sub{color:var(--soft);font-size:13.5px;line-height:1.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.tag{display:inline-block;background:var(--panel);border-radius:20px;padding:3px 10px;
  font-size:12px;font-weight:500;color:var(--soft)}
.tag.gift{background:#FDF3E3;color:var(--amber)}
.tag.ver{background:#E9F6EE;color:var(--green)}
.tag.no{background:#FBEBEA;color:var(--red)}
.stars{color:#E0A030;letter-spacing:1.5px;font-size:14px}

.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}
.thumbs img,.thumbs video{width:92px;height:92px;object-fit:cover;border-radius:9px;background:var(--panel)}

/* важная плашка секрета */
.secret{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:#FDF3E3;border:1px solid #F0D9A8;border-radius:10px;padding:12px 14px;margin:12px 0}
.secret span{font-weight:600;font-size:14.5px;color:#7A4E06}

select,input[type=text],input[type=search]{background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;font:500 13.5px 'Inter',sans-serif;color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--ink)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line-soft)}
th{color:var(--soft);font-weight:500;font-size:12.5px;background:var(--panel)}
th:first-child{border-radius:9px 0 0 0} th:last-child{border-radius:0 9px 0 0}
tr:last-child td{border-bottom:0}
.wrap-t{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.scroll{overflow-x:auto}

.note{border:1px solid var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--soft)}
.note b{display:block;color:var(--ink);font-weight:600;margin-bottom:5px;font-size:15px}
.warnbox{background:#FDF3E3;border:1px solid #F0D9A8;border-radius:var(--r);
  padding:13px 15px;font-size:13.5px;color:#7A4E06;margin-bottom:20px;font-weight:500;line-height:1.55}
.warnbox.err{background:#FBEBEA;border-color:#E8B4B0;color:#8B2E26}
.loading{padding:40px;text-align:center;color:var(--faint)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1;min-width:160px;max-width:340px;padding:10px 14px;font-size:15px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 13px 'Inter',sans-serif;color:var(--soft);cursor:pointer;transition:background .13s,color .13s,border-color .13s}
.chip:hover{background:var(--panel);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pill.wait{background:#FDF3E3;color:var(--amber)}
.pill.ok{background:#E9F6EE;color:var(--green)}
.pill.bad{background:#FBEBEA;color:var(--red)}
.pill.neu{background:var(--panel);color:var(--soft)}
.srv{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:12.5px;color:var(--soft);margin-bottom:10px;border-radius:9px;background:var(--panel);line-height:1.4}
.srv::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.srv.on::before{background:var(--green)}
.srv.off::before{background:var(--amber)}
.srv.err::before{background:var(--red)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font:600 14px 'Inter',sans-serif;z-index:999;opacity:0;transition:transform .25s,opacity .25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--red)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.quick a,.quick button{display:inline-flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:600 12.5px 'Inter',sans-serif;color:var(--ink);text-decoration:none;cursor:pointer}
.quick a:hover,.quick button:hover{background:var(--line-soft)}
.order-meta{display:grid;gap:3px;margin:8px 0;font-size:13.5px;color:var(--soft);line-height:1.5}
.order-meta b{color:var(--ink);font-weight:600}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head-row h1{font-size:26px;font-weight:600;letter-spacing:-.025em;margin-bottom:4px}
.head-row p{color:var(--soft);font-size:14.5px}
.empty-filter{padding:28px 20px;text-align:center;color:var(--soft);border:1px dashed var(--line);border-radius:var(--r);margin-top:4px}

/* ═══════════════ ТЕЛЕФОН ═══════════════ */
@media (max-width:860px){
  .shell.on{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .side-top{padding-bottom:12px}
  .nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:8px 13px}
  .nav svg{display:none}
  .side-foot{display:flex;gap:16px;margin-top:12px;padding-top:10px}
  .main{padding:20px 16px 70px}
  .head h1{font-size:22px}
}
</style>
</head>
<body>

<!-- ═══════════════ ВХОД ═══════════════ -->
<div class="gate" id="gate">
  <div class="gate-logo">T</div>
  <h1>Панель TURTI</h1>
  <p>Введите пароль</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль">
  <button class="btn" id="go">Войти</button>
  <p class="gate-err" id="gerr"></p>
</div>

<!-- ═══════════════ ПАНЕЛЬ ═══════════════ -->
<div class="shell" id="shell">

  <aside class="side">
    <div class="side-top"><i>T</i><b>TURTI</b></div>
    <div class="srv off" id="srv">Проверяем сервер…</div>
    <nav class="nav" id="nav">
      <button class="on" data-p="orders">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        Заказы <span class="cnt zero" id="c-ord">0</span>
      </button>
      <button data-p="reviews">
        <svg viewBox="0 0 24 24"><path d="M12 4l2.3 5 5.2.6-3.8 3.5 1 5.1L12 15.7 7.3 18.2l1-5.1L4.5 9.6 9.7 9z"/></svg>
        Отзывы <span class="cnt zero" id="c-rev">0</span>
      </button>
      <button data-p="feedback">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Обратная связь
      </button>
      <button data-p="surprises">
        <svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M4 13h16M12 9v11"/><path d="M12 9c-1.8 0-3.5-1-3.5-2.5S10 4.5 12 9zm0 0c1.8 0 3.5-1 3.5-2.5S14 4.5 12 9z"/></svg>
        Секреты
      </button>
      <button data-p="qr">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2z"/></svg>
        QR и подарки
      </button>
      <button data-p="push">
        <svg viewBox="0 0 24 24"><path d="M18 15v-4a6 6 0 1 0-12 0v4l-1.5 2.5h15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        Напоминания
      </button>
    </nav>
    <div class="side-foot">
      <a href="index.html">← На сайт</a>
      <button id="out">Выйти</button>
    </div>
  </aside>

  <main class="main" id="main"><div class="loading">Загружаем…</div></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   ПАНЕЛЬ TURTI

   Работает в двух режимах, переключается сама:
     • файл открыт с компьютера → показывает заказы из этого браузера;
     • сайт опубликован и задан ADMIN_KEY → тянет всё с сервера.

   ВАЖНО про пароль ниже: он лежит в этом файле, поэтому защищает
   только от случайного захода. Настоящая защита — переменная ADMIN_KEY
   на сервере: без неё серверные данные не отдаются вообще.
   ══════════════════════════════════════════════════════════════════════ */

var PASSWORD = "turti-botlih-25";     // ← пароль для входа в панель. Меняйте здесь.

var $ = function (s) { return document.querySelector(s); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var rub = function (n) { return new Intl.NumberFormat("ru-RU").format(Math.round(Number(n) || 0)) + " ₽"; };
var when = function (s) { try {
  return new Date(s).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
} catch (e) { return ""; } };
var stars = function (n) { return "★".repeat(n) + "☆".repeat(5 - n); };

var STATUS_RU = {
  new: "Новый", awaiting_payment: "Ждёт оплату", pending_payment: "Ждёт оплату",
  paid: "Оплачен", processing: "Собираем", shipped: "Отправлен", delivered: "Доставлен",
  cancelled: "Отменён", payment_failed: "Оплата не прошла", done: "Выполнен"
};
var ORDER_FILTERS = [["all", "Все"], ["ship", "Собрать"], ["pay", "Ждут оплату"], ["done", "Отправленные"]];
var REVIEW_FILTERS = [["all", "Все"], ["pending", "На проверке"], ["approved", "Опубликованы"], ["rejected", "Отклонены"]];

var SERVER = false;
var page = "orders";
var orderFilter = "all";
var reviewFilter = "all";
var searchQ = "";
var toastTimer;
var SERVER_DETAIL = "";

function toast(msg, isErr) {
  var el = $("#toast"); if (!el) return;
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2800);
}
function statusRu(s) { return STATUS_RU[s] || s; }
function phoneDigits(p) {
  var d = String(p || "").replace(/\D/g, "");
  if (d.length === 11 && d[0] === "8") d = "7" + d.slice(1);
  return d;
}
function waLink(p) { var d = phoneDigits(p); return d ? "https://wa.me/" + d : ""; }
function telLink(p) { var d = phoneDigits(p); return d ? "tel:+" + d : ""; }
function copyText(t) {
  if (!t) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { toast("Скопировано"); }).catch(function () { toast("Не удалось скопировать", true); });
  } else {
    toast(t, false);
  }
}
function setServerPill() {
  var el = $("#srv"); if (!el) return;
  if (SERVER === true) { el.className = "srv on"; el.textContent = "Сервер подключён"; return; }
  if (SERVER === "file") { el.className = "srv err"; el.textContent = "Открыто с компьютера — нужен адрес Vercel"; return; }
  if (SERVER === "wrongkey") { el.className = "srv err"; el.textContent = "ADMIN_KEY на Vercel не совпадает с паролем"; return; }
  if (SERVER === "nokey") { el.className = "srv err"; el.textContent = "На Vercel не задан ADMIN_KEY"; return; }
  if (SERVER === "error" || SERVER === "offline") {
    el.className = "srv err";
    el.textContent = SERVER_DETAIL || "API недоступен — проверьте деплой";
    return;
  }
  el.className = "srv off";
  el.textContent = "Локальный режим — только заказы из браузера";
}
function serverStatusWarn() {
  if (location.protocol === "file:") {
    return '<div class="warnbox err"><b>Админка открыта с компьютера, не с Vercel.</b> ' +
      'Деплой сам по себе не помогает, если вы открываете файл двойным щелчком. ' +
      'Зайдите по адресу сайта: <strong>https://ваш-проект.vercel.app/admin</strong></div>';
  }
  if (SERVER === "wrongkey") {
    return '<div class="warnbox err"><b>Сервер отклонил пароль.</b> ' +
      'Vercel → Settings → Environment Variables → <code>ADMIN_KEY</code> = <code>turti-botlih-25</code> → Redeploy.</div>';
  }
  if (SERVER === "nokey") {
    return '<div class="warnbox err"><b>На Vercel не задан ADMIN_KEY.</b> ' +
      'Settings → Environment Variables → добавьте <code>ADMIN_KEY</code> = <code>turti-botlih-25</code> для Production → Redeploy.</div>';
  }
  if (SERVER === "error" || SERVER === "offline") {
    return '<div class="warnbox err"><b>Не удалось связаться с API.</b> ' +
      esc(SERVER_DETAIL || "Откройте /api/cities?q=мах — должен вернуть JSON.") +
      ' Если 404 — деплой не прошёл или старый коммит.</div>';
  }
  return "";
}
function toolbar(placeholder) {
  return '<div class="toolbar"><input type="search" class="search" id="q" placeholder="' + esc(placeholder) +
    '" value="' + esc(searchQ) + '"><button class="btn line s" type="button" id="refresh">↻ Обновить</button></div>';
}
function chips(items, current, attr) {
  return '<div class="chips">' + items.map(function (it) {
    return '<button type="button" class="chip' + (it[0] === current ? " on" : "") + '" data-' + attr + '="' + it[0] + '">' + it[1] + '</button>';
  }).join("") + '</div>';
}
function bindToolbar(redraw) {
  var q = $("#q"), rf = $("#refresh");
  if (q) q.oninput = function () { searchQ = q.value.trim(); redraw(); };
  if (rf) rf.onclick = function () { load(); toast("Обновлено"); };
}
function bindChips(attr, setter, redraw) {
  document.querySelectorAll("[data-" + attr + "]").forEach(function (btn) {
    btn.onclick = function () {
      setter(btn.getAttribute("data-" + attr));
      redraw();
    };
  });
}
function statusPill(o) {
  if (o.status === "cancelled" || o.status === "payment_failed") return '<span class="pill bad">' + esc(statusRu(o.status)) + '</span>';
  if (o.status === "shipped" || o.status === "delivered") return '<span class="pill ok">' + esc(statusRu(o.status)) + '</span>';
  if (o.paid || o.status === "paid" || o.status === "processing") return '<span class="pill ok">' + esc(statusRu(o.status)) + (o.paid ? "" : "") + '</span>';
  return '<span class="pill wait">' + esc(statusRu(o.status || (o.paid ? "paid" : "awaiting_payment"))) + '</span>';
}
function quickContact(o) {
  if (!o.phone) return "";
  return '<div class="quick">' +
    (telLink(o.phone) ? '<a href="' + telLink(o.phone) + '">Позвонить</a>' : "") +
    (waLink(o.phone) ? '<a href="' + waLink(o.phone) + '" target="_blank" rel="noopener">WhatsApp</a>' : "") +
    '<button type="button" data-copy="' + esc(o.phone) + '">Скопировать телефон</button>' +
    (o.id ? '<button type="button" data-copy="' + esc(o.id) + '">Скопировать №</button>' : "") +
  '</div>';
}
function filterOrders(list) {
  var q = searchQ.toLowerCase();
  return list.filter(function (o) {
    var hay = [o.id, o.name, o.phone, o.city, o.trackingNumber, o.pvzCode].join(" ").toLowerCase();
    if (q && hay.indexOf(q) < 0) return false;
    if (orderFilter === "ship") return o.paid && o.status !== "shipped" && o.status !== "delivered" && o.status !== "cancelled";
    if (orderFilter === "pay") return !o.paid && o.status !== "cancelled" && o.status !== "delivered";
    if (orderFilter === "done") return o.status === "shipped" || o.status === "delivered";
    return true;
  });
}
function filterReviews(list) {
  var q = searchQ.toLowerCase();
  return list.filter(function (r) {
    if (reviewFilter !== "all" && r.status !== reviewFilter) return false;
    if (!q) return true;
    var hay = [r.name, r.text, r.flavor, r.city, r.phoneTail, r.id].join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  }).sort(function (a, b) {
    var rank = { pending: 0, approved: 1, rejected: 2 };
    var ra = rank[a.status] != null ? rank[a.status] : 9;
    var rb = rank[b.status] != null ? rank[b.status] : 9;
    if (ra !== rb) return ra - rb;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });
}

/* ═══════════ вход ═══════════ */
$("#go").onclick = function () {
  if ($("#pw").value.trim() !== PASSWORD) { $("#gerr").textContent = "Неверный пароль"; return; }
  sessionStorage.setItem("turti_panel", "1");
  open_();
};
$("#pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("#go").click(); });
$("#out").onclick = function () { sessionStorage.removeItem("turti_panel"); location.reload(); };
if (sessionStorage.getItem("turti_panel")) open_();

function open_() {
  $("#gate").style.display = "none";
  $("#shell").classList.add("on");
  $("#nav").addEventListener("click", function (e) {
    var b = e.target.closest("[data-p]"); if (!b) return;
    document.querySelectorAll(".nav button").forEach(function (x) { x.classList.toggle("on", x === b); });
    page = b.dataset.p;
    load();
  });
  probe();
}

/* проверяем, есть ли сервер */
function probe() {
  if (location.protocol === "file:") {
    SERVER = "file";
    setServerPill();
    load();
    return;
  }
  fetch("/api/admin?section=stats", { headers: { "x-admin-key": PASSWORD } })
    .then(function (r) {
      return r.text().then(function (raw) {
        var d = {};
        try { d = raw ? JSON.parse(raw) : {}; } catch (e) { d = { ok: false, error: raw.slice(0, 120) }; }
        return { s: r.status, d: d };
      });
    })
    .then(function (res) {
      if (res.d && res.d.ok === true) {
        SERVER = true;
      } else if (res.s === 401) {
        SERVER = "wrongkey";
      } else if (res.s === 503 && String(res.d.error || "").indexOf("ADMIN_KEY") >= 0) {
        SERVER = "nokey";
      } else if (res.s === 404) {
        SERVER = "error";
        SERVER_DETAIL = "Маршрут /api/admin не найден (404). Нужен коммит с api/[...path].js.";
      } else {
        SERVER = "error";
        SERVER_DETAIL = (res.d && (res.d.error || res.d.hint)) || ("HTTP " + res.s);
      }
      setServerPill();
      load();
    })
    .catch(function (err) {
      SERVER = "offline";
      SERVER_DETAIL = err && err.message ? err.message : "Сеть или CORS";
      setServerPill();
      load();
    });
}

function api(section) {
  return fetch("/api/admin?section=" + section, { headers: { "x-admin-key": PASSWORD } })
    .then(function (r) { return r.json(); });
}
function act(body) {
  return fetch("/api/admin", {
    method: "POST",
    headers: { "x-admin-key": PASSWORD, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

/* ═══════════ отрисовка ═══════════ */
function load() {
  var m = $("#main");
  m.innerHTML = '<div class="loading">Загружаем…</div>';
  if (page !== "orders" && page !== "reviews") searchQ = "";

  if (page === "orders") return drawOrders();

  if (SERVER !== true) return m.innerHTML = head(titleOf(page), "") + offline();

  api(page === "surprises" ? "surprises" : page).then(function (d) {
    if (!d.ok) { m.innerHTML = head(titleOf(page), "") + '<div class="note"><b>' + esc(d.error) + '</b>' + esc(d.hint || "") + '</div>'; return; }
    if (page === "reviews") drawReviews(d);
    if (page === "feedback") drawFeedback(d);
    if (page === "surprises") drawSurprises(d);
    if (page === "qr") drawQr(d);
    if (page === "push") drawPush(d);
  });
}

function titleOf(p) {
  return { orders: "Заказы", reviews: "Отзывы", feedback: "Обратная связь", surprises: "Секретные комплименты",
           qr: "QR и подарочные наборы", push: "Напоминания" }[p];
}

function head(t, sub) {
  return '<div class="head-row"><div><h1>' + t + '</h1>' + (sub ? '<p>' + sub + '</p>' : "") + '</div></div>';
}

function offline() {
  var w = serverStatusWarn();
  if (w) return w;
  return '<div class="note"><b>Сервер пока недоступен</b>' +
    'Отзывы, QR и напоминания хранятся на сервере. Заказы этого браузера — в разделе «Заказы».</div>';
}

/* ─── ЗАКАЗЫ: работают и локально, и с сервера ─── */
function renderOrders(list, sub, warn) {
  var m = $("#main");
  var wait = list.filter(function (o) { return o.paid && o.status !== "shipped" && o.status !== "delivered"; }).length;
  var sec = list.filter(function (o) { return o.surpriseId && !o.surpriseUsed; }).length;
  var shown = filterOrders(list);
  badge("c-ord", wait);
  m.innerHTML = head("Заказы", sub) +
    (warn || "") +
    tiles([[list.length, "всего"], [wait, "собрать", wait ? "hi" : ""], [sec, "с секретом", sec ? "hot" : ""],
           [rub(list.reduce(function (s, o) { return s + (o.total || 0); }, 0)), "оборот"]]) +
    toolbar("Поиск: имя, телефон, город, № заказа") +
    chips(ORDER_FILTERS, orderFilter, "of") +
    (shown.length ? shown.map(serverOrder).join("") :
      (list.length ? '<div class="empty-filter">По фильтру ничего не найдено</div>' : '<div class="note"><b>Заказов пока нет</b></div>'));
  bindToolbar(function () { renderOrders(list, sub, warn); });
  bindChips("of", function (v) { orderFilter = v; }, function () { renderOrders(list, sub, warn); });
  bind();
}

function drawOrders() {
  if (SERVER === true) {
    api("orders").then(function (d) {
      renderOrders(d.items || [], "Данные с сервера", "");
    });
    return;
  }

  var all = [];
  try { all = JSON.parse(localStorage.getItem("turti_orders")) || []; } catch (e) { all = []; }
  var warn = serverStatusWarn() || ('<div class="warnbox">Сервер не подключён — показываем только заказы, ' +
    'сохранённые в этом браузере. После настройки Vercel заказы будут приходить на сервер.</div>');
  renderOrders(all.map(function (o, i) {
    return {
      id: "local-" + (i + 1), name: o.name, phone: o.phone, city: o.city, pvzCode: o.pvz,
      address: o.pvz, deliveryLabel: o.delivery || "", total: o.total, paid: o.status !== "new",
      status: o.status === "done" ? "delivered" : (o.status || "new"), createdAt: o.date,
      lines: (o.items || []).map(function (l) { return { label: l.label, sub: "", qty: l.qty }; }),
      _localIndex: i, _localRaw: o
    };
  }), "Из браузера этого компьютера", warn);

  $("#main").addEventListener("click", function (e) {
    var cp = e.target.closest("[data-copy]");
    if (cp) { copyText(cp.getAttribute("data-copy")); return; }
    var b = e.target.closest("[data-loc]"); if (!b) return;
    var a = JSON.parse(localStorage.getItem("turti_orders") || "[]");
    var i = Number(b.dataset.loc);
    if (b.dataset.do === "del") { if (!confirm("Удалить заказ?")) return; a.splice(i, 1); toast("Заказ удалён"); }
    else { a[i].status = "done"; toast("Отмечен выполненным"); }
    localStorage.setItem("turti_orders", JSON.stringify(a));
    drawOrders();
  }, { once: true });
}

function bind() {
  $("#main").addEventListener("click", function (e) {
    var cp = e.target.closest("[data-copy]");
    if (cp) { copyText(cp.getAttribute("data-copy")); return; }
    var b = e.target.closest("[data-a]"); if (!b) return;
    var rec = b.closest(".rec");
    var body = { action: b.dataset.a, id: b.dataset.sid || (rec && rec.dataset.id) };
    if (b.dataset.a === "surprise-use") body.orderId = b.dataset.oid || "";
    if (b.dataset.a === "order-status") {
      body.status = rec.querySelector('[data-f="status"]').value;
      body.tracking = rec.querySelector('[data-f="tracking"]').value;
    }
    if (b.dataset.a === "order-refund") {
      body.id = rec && rec.dataset.id;
      if (b.dataset.full && !confirm("Сделать полный возврат через ЮKassa?")) return;
    }
    if (b.dataset.a === "review-delete" && !confirm("Удалить отзыв навсегда?")) return;
    b.disabled = true;
    act(body).then(function (r) {
      if (!r.ok) { toast(r.error || "Не получилось", true); b.disabled = false; return; }
      toast("Сохранено");
      load();
    }).catch(function () { toast("Сервер недоступен", true); b.disabled = false; });
  }, { once: true });
}
</script>
</body>
</html>
